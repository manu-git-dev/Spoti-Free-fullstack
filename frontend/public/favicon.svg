<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Spoti-Free">
  <!--
    Icone "headset" de Lucide (lucide.dev/icons/headset), licence ISC — la meme bibliotheque
    que celle utilisee dans toute l'interface (`lucide-react`), pour que l'onglet parle le meme
    langage graphique que l'app.

    Pastille pleine plutot que le seul trace : un favicon fait 16 px dans un onglet, et un trait
    de 2 px y devient invisible. La masse coloree se voit, et elle tient aussi bien sur un onglet
    clair que sombre — un trace violet sur fond transparent disparaitrait sur l'un des deux.
  -->
  <rect width="24" height="24" rx="5.5" fill="#6D5DE7" />

  <!--
    L'icone est dessinee sur une grille de 24 : on la reduit a 75 % et on la recentre pour lui
    laisser une marge interieure. `stroke-width` passe a 2.6 pour compenser la reduction
    (2.6 x 0.75 = 1.95, soit l'epaisseur d'origine une fois remise a l'echelle).
  -->
  <g transform="translate(3 3) scale(0.75)"
     fill="none" stroke="#FFFFFF" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z" />
    <path d="M21 16v2a4 4 0 0 1-4 4h-5" />
  </g>
</svg>
